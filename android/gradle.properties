# Gradle/JVM memory is deliberately capped.
#
# This machine has 16 GB shared with the desktop. An uncapped Gradle daemon
# plus a separate Kotlin compile daemon (which is where KSP runs) is the
# difference between a build that works and an OOM that takes the whole session
# with it. Measured here: a single runaway child process managed to pull the
# session's own Python to 13 GB, so headroom matters.
#
# One JVM, modest heap, few workers. Builds are slower and finish every time.

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=false

# Compile Kotlin inside the Gradle daemon instead of spawning a second long-lived
# JVM. Saves roughly a gigabyte of resident memory; the trade is a slightly
# slower build.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

# AndroidX only, so no legacy support-library classes are pulled in.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Room's schema directory, so migrations can be diffed in review.
ksp.incremental=true